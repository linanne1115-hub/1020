<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="ask">
<header class="site"><nav id="nav"></nav><div class="tools" id="tools"></div></header>
<main>
  <h1 data-i="h"></h1>
  <div class="card">
    <label for="q" data-i="ql" style="display:block;margin:0 0 6px;white-space:normal"></label>
    <textarea id="q" rows="3" maxlength="2000" style="width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical"></textarea>
    <button id="send" data-i="send" style="margin-top:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 18px;cursor:pointer;font:inherit"></button>
    <div id="ans" aria-live="polite" style="white-space:pre-wrap;word-break:break-word;margin-top:12px"></div>
  </div>
  <div class="card">
    <button id="ping" data-i="btn" style="border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 18px;cursor:pointer;font:inherit"></button>
    <button id="gem" data-i="btn2" style="border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 18px;cursor:pointer;font:inherit"></button>
    <pre id="out" aria-live="polite" style="white-space:pre-wrap;word-break:break-word;margin:12px 0 0;font:inherit;font-size:.9rem"></pre>
  </div>
</main>
<footer class="site" id="foot"></footer>
<div id="tip"></div>
<script>
window.PAGE_TEXT={
zh:{doc:"問答｜婚姻狀態與憂鬱、焦慮、壓力",h:"問答",ql:"請輸入你的問題（系統只會根據研究的摘要表回答）",send:"送出",ph:"例如：未婚與已婚的憂鬱平均有什麼差異？",answering:"回答中…",empty:"請先輸入問題。",
btn:"測試連線",btn2:"測試 Gemini",wait:"連線中…",fail:"連線失敗：",
noUrl:"尚未設定後端網址：請打開 ask.html，把 WORKER_URL 改成你的 Worker 網址。"},
en:{doc:"Q&A | Marital Status and Depression, Anxiety, and Stress",h:"Q&A",ql:"Enter your question (answers are based only on the study’s summary table)",send:"Send",ph:"e.g., How do the mean depression scores of never-married and married people differ?",answering:"Answering…",empty:"Please enter a question first.",
btn:"Test connection",btn2:"Test Gemini",wait:"Connecting…",fail:"Connection failed: ",
noUrl:"Backend URL not set: open ask.html and change WORKER_URL to your Worker URL."}};
</script>
<script src="site.js"></script>
<script>
// 把這裡換成你的 Worker 網址，例如 "https://名稱.帳號.workers.dev"
const WORKER_URL="https://nameless-darkness-e7d1.linanne1115.workers.dev/";

const GEMINI_QUESTION="請用一句話自我介紹";

// 送出 JSON 到後端。onOk 有給時，成功只顯示它回傳的文字；沒給時顯示完整回應。
async function callWorker(payload,onOk){
  const btns=document.querySelectorAll("#ping,#gem"),out=document.getElementById("out");
  if(!/^https?:\/\//.test(WORKER_URL)){out.textContent=tr("noUrl");return}
  btns.forEach(b=>b.disabled=true);
  out.textContent=tr("wait");
  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const text=await res.text();
    let data=null;
    try{data=JSON.parse(text)}catch(e){}
    if(!onOk){
      out.textContent="HTTP "+res.status+"\n"+(data?JSON.stringify(data,null,2):text);
    }else if(res.ok&&data&&data.ok){
      out.textContent=onOk(data);
    }else{
      out.textContent="HTTP "+res.status+"\n"+((data&&data.error)||text);
    }
  }catch(e){
    out.textContent=tr("fail")+e.message;
  }finally{
    btns.forEach(b=>b.disabled=false);
  }
}
document.getElementById("ping").addEventListener("click",()=>callWorker({action:"test"}));
document.getElementById("gem").addEventListener("click",()=>callWorker({action:"ask",question:GEMINI_QUESTION},d=>d.answer));

// ===== 問答 =====
const q=document.getElementById("q"),ans=document.getElementById("ans"),send=document.getElementById("send");
function setPh(){q.placeholder=tr("ph")}
window.onLang=setPh;setPh();
async function submitQ(){
  const text=q.value.trim();
  if(!text){ans.textContent=tr("empty");return}
  if(!/^https?:\/\//.test(WORKER_URL)){ans.textContent=tr("noUrl");return}
  send.disabled=true;
  ans.textContent=tr("answering");
  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"ask",question:text})
    });
    const raw=await res.text();
    let d=null;
    try{d=JSON.parse(raw)}catch(e){}
    if(res.ok&&d&&typeof d.answer==="string")ans.textContent=d.answer;
    else ans.textContent="HTTP "+res.status+"\n"+((d&&d.error)||raw);
  }catch(e){
    ans.textContent=tr("fail")+e.message;
  }finally{
    send.disabled=false;
  }
}
send.addEventListener("click",submitQ);
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();submitQ()}});
</script>
</body>
</html>
